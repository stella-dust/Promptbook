function exportDraft(){collectDraft();downloadJSON('promptbook-local-draft.json',{schemaVersion:1,stage:'local-draft',...state.draft,localFiles:state.files.map(f=>({name:f.file.name,mimeType:f.file.type,bytes:f.file.size,width:f.width,height:f.height,durationSeconds:f.duration||null})),notice:'草稿含文件说明但不包含媒体字节，也不是可直接发布的 canonical entry。'});notify('已导出文字与文件说明；媒体仍需保留原文件')}
function downloadJSON(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function inspectFile(file){const src=URL.createObjectURL(file);const kind=file.type.startsWith('video/')?'video':'image';try{if(kind==='image'){const im=new Image();im.src=src;await im.decode();return {file,src,kind,width:im.naturalWidth,height:im.naturalHeight,poster:src}}const v=document.createElement('video');v.preload='metadata';v.muted=true;v.src=src;await new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(new Error('无法读取视频，请换用浏览器可播放的 MP4 / WebM')),10000);v.onloadedmetadata=()=>{clearTimeout(t);resolve()};v.onerror=()=>{clearTimeout(t);reject(new Error('当前浏览器无法播放这个视频'))}});const result={file,src,kind,width:v.videoWidth,height:v.videoHeight,duration:v.duration,poster:null};if(!result.width||!result.height||!Number.isFinite(result.duration))throw new Error('视频元数据不完整');try{await new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(new Error('poster timeout')),3000);v.onseeked=()=>{clearTimeout(t);resolve()};v.currentTime=Math.min(.1,v.duration/2)});const c=document.createElement('canvas');c.width=600;c.height=Math.round(result.height/result.width*600);c.getContext('2d').drawImage(v,0,0,c.width,c.height);result.poster=c.toDataURL('image/webp',.85)}catch{}v.removeAttribute('src');v.load();return result}catch(e){URL.revokeObjectURL(src);throw e}}
async function addFiles(files){const allowed=['image/png','image/jpeg','image/webp','video/mp4','video/webm'];for(const file of Array.from(files)){if(state.files.length>=8){notify('每条记录最多 8 个结果');break}if(!allowed.includes(file.type)){notify('原型支持 PNG、JPEG、WebP、MP4 和 WebM');continue}const kind=file.type.startsWith('video/')?'video':'image';if(kind!==state.draft.kind){notify('请切换为对应结果类型；同条记录不混合图和视频');continue}if(file.size>(kind==='image'?40:250)*1024*1024){notify(kind==='image'?'图片超过 40 MiB 限额':'视频超过 250 MiB 限额');continue}try{state.files.push(await inspectFile(file));renderUploads()}catch(e){notify(e.message||'文件读取失败')}}}
function renderUploads(){const list=document.getElementById('uploaded-list');if(!list)return;list.innerHTML=state.files.map((f,i)=>`<div class="upload-tile">${f.kind==='video'?`<video controls playsinline preload="none" src="${esc(f.src)}" ${f.poster?`poster="${esc(f.poster)}"`:''} aria-label="${esc(f.file.name)}"></video>`:`<img src="${esc(f.src)}" alt="${esc(f.file.name)}">`}<button type="button" class="remove-file" data-remove="${i}" aria-label="移除 ${esc(f.file.name)}">${icon('close')}</button><div class="upload-info"><span class="upload-name">${esc(f.file.name)}<br>${f.width}×${f.height} · ${(f.file.size/1024/1024).toFixed(2)} MB</span><button type="button" class="cover-choice ${state.coverIndex===i?'active':''}" data-cover="${i}">${state.coverIndex===i?'封面':'设为封面'}</button></div></div>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.remove);const [f]=state.files.splice(i,1);/* Preserve existing session entries that may reuse this blob URL. */if(!state.entries.some(e=>e.files?.some(x=>x.src===f.src)))URL.revokeObjectURL(f.src);if(state.coverIndex>=state.files.length)state.coverIndex=0;renderUploads()});list.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{state.coverIndex=Number(b.dataset.cover);renderUploads()})}
function createLocalEntry(){collectDraft();const d=state.draft;if(!d.title.trim())throw new Error('请填写一个标题。');if(!d.prompt.trim())throw new Error('请粘贴实际使用的完整 Prompt。');if(!d.model.trim())throw new Error('请填写模型显示名；不确定时写“未知模型”。');if(!state.files.length)throw new Error('请添加至少一个实际结果文件。');let params;try{params=JSON.parse(d.parameters||'{}')}catch{throw new Error('其他参数需要是合法 JSON，例如 {}。')}if(!params||Array.isArray(params)||typeof params!=='object'||Object.values(params).some(v=>v!==null&&!['string','number','boolean'].includes(typeof v)))throw new Error('参数应为简单 JSON 键值，值为文字、数字、布尔值或 null。');const f=state.files[state.coverIndex]||state.files[0];return{id:'local-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),title:d.title.trim(),prompt:d.prompt,category:d.category,categoryName:CAT.find(c=>c[0]===d.category)?.[1]||d.category,kind:d.kind,model:d.model,modelId:d.modelId,platform:d.platform,date:new Date().toISOString().slice(0,10),cover:f.poster||f.src,video:f.kind==='video'?f.src:null,width:f.width,height:f.height,duration:f.duration,notes:d.notes,parameters:d.parameters,files:[...state.files],coverIndex:state.coverIndex,demo:false}}
function submitRecord(preview){try{const entry=createLocalEntry();document.getElementById('form-error').textContent='';persistDraft(false);if(preview){entry.isPreview=true;state.preview=entry;navigate('/entry/'+entry.id);return}showDialog('这次先保存在原型里',`<p>正式版本会上传媒体并写入 GitHub。当前按钮只会把记录添加到本页的演示列表，<b>不产生云端上传或真实发布</b>。</p><p>页面刷新后，演示列表和所选媒体会重置。文字草稿会继续留在本机。</p>`,[{label:'返回检查',kind:'secondary',action:closeDialog},{label:'添加到演示列表',kind:'primary',action:()=>{closeDialog();state.entries.unshift(entry);state.files=[];state.coverIndex=0;state.draft={...initialDraft,platform:state.draft.platform,model:state.draft.model,category:state.draft.category};try{localStorage.removeItem(DRAFT_KEY)}catch{}restoredDraft=null;state.homeHash='#/';location.hash='/';notify('已加入本页演示列表，未上传 GitHub 或 R2')}}])}catch(e){document.getElementById('form-error').textContent=e.message;notify(e.message)}}
function closeDialog(){document.getElementById('dialog').close()}
function showDialog(title,body,actions=[]){const d=document.getElementById('dialog');d.className='dialog';d.innerHTML=`<div class="dialog-inner"><div class="dialog-top"><h2>${esc(title)}</h2><button class="icon-button" aria-label="关闭" id="close-dialog">${icon('close')}</button></div>${body}<div class="dialog-actions">${actions.map((a,i)=>`<button class="${a.kind||'secondary'}" data-dialog-action="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;document.getElementById('close-dialog').onclick=closeDialog;d.querySelectorAll('[data-dialog-action]').forEach(b=>b.onclick=actions[Number(b.dataset.dialogAction)].action);d.showModal();d.onclick=e=>{if(e.target===d)closeDialog()}}
function showLightbox(src,title){const d=document.getElementById('dialog');d.className='dialog lightbox';d.innerHTML=`<button class="icon-button" id="close-dialog" aria-label="关闭完整图片">${icon('close')}</button><img src="${esc(src)}" alt="${esc(title)}">`;document.getElementById('close-dialog').onclick=closeDialog;d.showModal();d.onclick=e=>{if(e.target===d)closeDialog()}}
function showContribute(){showDialog('通过 GitHub 留下一份灵感',`<p>没有社区账号，也不用申请上传权限。</p><ul><li>修正已有记录：直接修改对应 JSON 提交 PR。</li><li>新增案例：提交 Prompt、模型说明、真实结果临时链接与署名。</li><li>维护者整理媒体到 R2 后，发布到这本手记。</li></ul><p>生产图片和视频不直接放进 Git 历史。新增 contribution 合并后仍需维护者整理，才会出现在网站。</p><div class="warning">这是设计原型，尚未绑定实际 GitHub 仓库。下载的模板需要填写真实内容。</div>`,[{label:'下载投稿模板',action:()=>downloadJSON('submission.example.json',SUBMISSION_TEMPLATE)},{label:'知道了',kind:'primary',action:closeDialog}])}
function showCost(){showDialog('大文件放 R2，记录放 Git',`<p>R2 Standard 存储粗算：账号剩余免费额度默认 10 GB-month，超过部分 $0.015 / GB-month。本页仅演示存储成本，不计操作、域名或其他服务。</p><div class="cost-fields"><label class="field"><span>存储量（GB-month）</span><input class="text-input" type="number" min="0" step="1" id="cost-gb" value="50"></label><label class="field"><span>剩余免费额度（GB-month）</span><input class="text-input" type="number" min="0" max="10" step="1" id="cost-free" value="10"></label></div><div class="cost-total">每月存储约<strong id="cost-result">$0.60</strong>仅 R2 Standard，按 GB 计费单位向上取整。</div><p>核实日期 2026-09-20；完整公式和来源在开发包 COSTS.md。两只 R2 桶共享账户额度。</p>`,[{label:'返回手记',kind:'primary',action:closeDialog}]);const update=()=>{const gb=Number(document.getElementById('cost-gb').value),fr=Number(document.getElementById('cost-free').value);document.getElementById('cost-result').textContent=Number.isFinite(gb)&&Number.isFinite(fr)&&gb>=0&&fr>=0&&fr<=10?'$'+(Math.max(0,Math.ceil(gb)-fr)*.015).toFixed(2):'检查输入'};document.getElementById('cost-gb').oninput=update;document.getElementById('cost-free').oninput=update}
function bindCommon(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='new')navigate('/new');if(a==='contribute')showContribute();if(a==='cost')showCost();if(a==='about')showDialog('这是一份可操作的设计稿',`<p>用于确认首页、详情和录入流程的视觉与操作。样例插画和动画为界面测试素材，未调用任何生成模型。</p><p>原型已实现本地筛选、复制、真实文件预览、文字草稿和草稿导出。云端鉴权、R2 上传、GitHub 提交、Blob 持久化属于正式工程阶段。</p><p>整个原型自包含，可在本地打开；不会发送图片、提示词或模型请求。</p>`,[{label:'关闭',kind:'primary',action:closeDialog}])})}
function render(){resizeObserver?.disconnect();document.querySelectorAll('video').forEach(v=>v.pause());const r=currentRoute();if(r.startsWith('/entry/'))renderDetail(decodeURIComponent(r.slice(7).split('?')[0]));else if(r==='/new')renderEditor();else renderHome()}
window.addEventListener('hashchange',render);window.addEventListener('resize',()=>{clearTimeout(layoutTimer);layoutTimer=setTimeout(layoutGallery,50)});window.addEventListener('paste',e=>{if(currentRoute()!=='/new')return;const files=Array.from(e.clipboardData?.items||[]).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();addFiles(files)}});
render();
</script></body></html>
